<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZIZ | عزيز للأسهم</title><style> *{box-sizing:border-box}body{background:#09182d;color:#e5bc65;font:17px system-ui;margin:0}main{max-width:800px;margin:auto;padding:20px}h1,h2{text-align:center}h1{font-size:44px;margin:12px}p{text-align:center}#tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,input,select{font:inherit;border:1px solid #c9a34f;border-radius:12px;padding:13px;background:#12243d;color:#e5bc65}button{cursor:pointer}.tile{min-height:100px;display:grid;place-content:center;gap:8px}.tile span{font-size:26px}section{border:1px solid #a18448;border-radius:14px;padding:15px;margin:12px 0}input{max-width:100%;width:100%;margin:5px 0}small{color:#c4c9d0}table{width:100%;font-size:14px}td{padding:8px;border-bottom:1px solid #445} .buy{background:#17653d;color:white} body{background:#101c2e;color:#edc675}main{max-width:1100px;padding:17px}header h1{font-size:36px;margin:12px 0 4px}header p{color:#eee;margin:0 0 26px}.markets,.search{display:flex;gap:10px;margin-bottom:16px;direction:ltr}.markets button{flex:1;background:#1d324f;border:0;font-weight:bold}.markets .active,.search button{background:#edc675;color:#101c2e}.search{background:#16263d;border-radius:15px;padding:8px}.search input{flex:1;min-width:0;border:0;background:transparent;direction:rtl}.sections,.marketInfo{background:#1d324f;border:0;border-radius:20px;padding:17px}.sections h3,.marketInfo h3{margin:0 0 14px;text-align:left}.tile{background:linear-gradient(110deg,#101c2e,#16263d);border:1px solid #88794f;border-radius:20px;min-height:145px;font-weight:600;justify-items:center}.tile span{background:#2b3541;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:32px}.tile:last-child{grid-column:span 2;min-height:100px}#tiles{gap:12px}.marketInfo small{color:#b7c5d6}@media(max-width:500px){main{padding:10px}.tile{min-height:112px;font-size:14px}header h1{font-size:29px}.sections{padding:10px}.tile span{width:42px;height:42px;font-size:25px}} .scan{background:#1d324f;border:0;direction:ltr;text-align:left}.scan h3{font-weight:600}.scan small{display:block;margin:10px 0}.periods,.scanActions{display:flex;gap:6px;flex-wrap:wrap}.periods button{flex:1;border:0}.periods .selected{background:#edc675;color:#101c2e}progress{width:100%;accent-color:#edc675;margin:12px 0}.scanRow{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;color:#eee}.scanLink{display:block;border:0;background:transparent;padding:8px 0}.green{color:#31d45f}.scanHead{margin:16px 0}article{margin:12px 0}.scanActions button{border:0}.opRoom{direction:ltr;text-align:left}.opRoom p{text-align:left;color:#eee}.opRoom small{display:block;margin:10px 0;color:#b7c5d6}.opCard{background:#1d324f;border:0;color:#eee}.opTop{display:flex;justify-content:space-between;gap:8px}.opChecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.opChecks div{display:grid;gap:5px;text-align:center;background:#16263d;padding:10px;border-radius:8px;font-size:14px}.opRoom .opGold{color:#edc675}.opTransfer{background:#edc675;color:#101c2e;display:block;margin:12px 0}.opTransfer:disabled{background:#304259;color:#b7c5d6;cursor:not-allowed}.opDelete{display:block;color:#ff5656;background:transparent;border:0;padding-left:0} .pageNav{display:flex;justify-content:space-between;align-items:center;gap:8px}.pageNav h2{font-size:20px;margin:0}.companyRow{display:flex;align-items:center;gap:8px;margin:7px 0}.companyRow button:first-child{flex:1;text-align:right}.companyRow .green{color:#31d45f}.companyList{max-height:70vh;overflow:auto}.eyeCard{background:#203550;color:#eee;padding:12px;border-radius:10px;margin:10px 0}.eyeCard summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}.eyeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}.eyeGrid div{background:#203550;padding:12px;border-radius:8px;text-align:center;color:#edc675}.eyeLine{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #52647a}.eyeGold{background:#edc675;color:#101c2e;width:100%;margin:10px 0}#eyeRoot p{text-align:right;color:#eee}</style><main><header><h1>⌁ AZIZ للأسهم</h1><p>التحليل الفني الشامل</p></header><div id="homePanel"><div class="markets"><button id="sa" onclick="choose('sa')">🇸🇦 السوق السعودي</button><button id="us" onclick="choose('us')">🇺🇸 السوق الأمريكي</button></div><div class="search"><input id="quick" placeholder="رمز السهم، مثل 1120"><button onclick="quickAnalyze()">تحليل</button></div><div class="sections"><h3>▦ أقسام البرنامج</h3><div id="tiles"></div></div><section class="marketInfo"><h3>↻ بيانات السوق الحقيقية</h3><small>اكتب رمز السهم ثم اضغط تحليل لجلب بيانات فعلية</small></section></div><div id="page" hidden></div></main><script>const names=['الماسح الشامل','تحليل السهم الشامل','الأسهم المفضلة','تنبيهات الفرص','الأسهم السعودية','سجل التوصيات','عين عزيز الذكية','الأسهم الأمريكية','حارس الصفقة','صائد الارتداد','التنبيهات الذكية','ذاكرة عزيز','المحفظة الوهمية'];const icons=['⌗','⌁','♥','♧','▦','▤','◉','◎','⛨','↗','♧','◴','▣'];let market='sa';function choose(m){market=m;$('sa').classList.toggle('active',m==='sa');$('us').classList.toggle('active',m==='us');$('quick').placeholder=m==='sa'?'رمز السهم، مثل 1120':'رمز سهم ناسداك، مثل AAPL'}function quickAnalyze(){let v=$('quick').value;openPage(1);$('symbol').value=v;quote()}const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('aziz-new-v1'))||{cash:10000,recs:[],positions:[],history:[]}}catch{state={cash:10000,recs:[],positions:[],history:[]}}function save(){try{localStorage.setItem('aziz-new-v1',JSON.stringify(state))}catch{alert('تعذر الحفظ المحلي')}}function home(){scanRun++;$('page').hidden=true;$('homePanel').hidden=false}function openPage(i){scanRun++;$('homePanel').hidden=true;$('page').hidden=false;$('page').innerHTML=`<nav class="pageNav"><button onclick="home()">‹ رجوع</button><h2>${names[i]}</h2><button onclick="home()">🏠 الرئيسية</button></nav><div id="content"></div>`;if(i===0)scanner();else if(i===2)renderFavorites();else if(i===3)renderAlerts();else if(i===4||i===7)companyPage(i===4?"sa":"us");else if(i===6)eyePage();else if(i===8)guardPage();else if(i===9)reboundPage();else if(i===10)smartPage();else if(i===5)recs();else if(i===11)memPage();else if(i===12)wallet();else if(i===1) $('content').innerHTML='<section><label>رمز السهم في ياهو</label><input id="symbol" placeholder="1120.SR أو AAPL"><button onclick="quote()">جلب البيانات</button><div id="result"></div></section>';else $('content').innerHTML='<section>لم يتم ربط بيانات هذه الوظيفة بعد. لا توجد نتائج افتراضية.</section>'}let recMarket='sa',recRun=0;
const recM=r=>r.market||'us',recEntry=r=>r.entry??r.price*(recM(r)==='sa'?3.75:1),recFmt=v=>Number.isFinite(v)?v.toFixed(2):'—';
function recs(m=market){recMarket=m;recRun++;renderRecs()}
function renderRecs(){let m=recMarket,u=m==='sa'?'ريال':'دولار';$('content').innerHTML=`<section><div class="markets"><button class="${m==='sa'?'active':''}" onclick="recs('sa')">السعودي</button><button class="${m==='us'?'active':''}" onclick="recs('us')">ناسداك</button></div><small>الأسعار بـ${u} • الشراء تجريبي فقط • آخر شموع يومية من ياهو</small><input id="rs" placeholder="رمز السهم"><input id="rn" placeholder="اسم الشركة (اختياري)"><input id="rp" type="number" step="any" placeholder="سعر الدخول"><input id="rt1" type="number" step="any" placeholder="الهدف الأول"><input id="rt2" type="number" step="any" placeholder="الهدف الثاني"><input id="rt3" type="number" step="any" placeholder="الهدف الثالث"><input id="rst" type="number" step="any" placeholder="وقف الخسارة"><button onclick="addRec()">إضافة توصية يدوية</button><button onclick="refreshRecs()">تحديث الأسعار</button></section>`+state.recs.map((r,i)=>{if(recM(r)!==m)return '';let e=recEntry(r),p=r.last,pct=Number.isFinite(p)?100*(p/e-1):null;return `<section class="opCard"><h3>${esc(r.name||r.symbol)} — ${esc(r.symbol)}</h3><small>تاريخ التوصية: ${esc(r.created?new Date(r.created).toLocaleString('ar-SA'):'غير مسجل')}</small><p>الدخول: ${recFmt(e)} ${u} • آخر سعر: ${recFmt(p)}</p><p style="color:${pct===null?'#ddd':pct>=0?'#56d6a0':'#ff9999'}">الربح / الخسارة: ${recFmt(pct)}%</p>${(r.targets||[]).map((t,k)=>`<p>الهدف ${k+1}: ${recFmt(t)} — ${r.hits?.[k]?'تحقق حسب الشموع':'لم يؤكد'}</p>`).join('')}<p>وقف الخسارة: ${recFmt(r.stop)} — ${r.stopped?'تم بلوغه حسب الشموع':'لم يؤكد'}</p><small>${esc(r.status||'لم يحدث السعر')} ${esc(r.lastDate||'')}</small><div><button class="green" onclick="recFavorite(${i})">💚</button><button class="buy" onclick="buy(${i})">شراء</button><button onclick="refreshRecs(${i})">تحديث</button><button class="opDelete" onclick="deleteRec(${i})">حذف التوصية</button></div></section>`}).join('')}
function addRec(){let m=recMarket,s=$('rs').value.trim().toUpperCase(),name=$('rn').value.trim(),e=+$('rp').value,t=[1,2,3].map(i=>+$('rt'+i).value),stop=+$('rst').value;if(m==='sa'&&/^\d{4}$/.test(s))s+='.SR';if(!(m==='sa'?/^\d{4}\.SR$/:/^[A-Z][A-Z0-9.\-]{0,11}$/).test(s)||![e,...t,stop].every(v=>Number.isFinite(v)&&v>0)||!(stop<e&&e<t[0]&&t[0]<t[1]&&t[1]<t[2]))return alert('تحقق من الرمز وترتيب الدخول والأهداف والوقف');if(state.recs.some(r=>r.symbol===s&&recM(r)===m))return alert('التوصية موجودة');state.recs.push({symbol:s,name:name||s,market:m,entry:e,price:e/(m==='sa'?3.75:1),targets:t,stop,created:Date.now()});save();renderRecs()}
function recFavorite(i){let r=state.recs[i];state.favorites??=[];if(!state.favorites.some(z=>z.symbol===r.symbol&&z.market===recM(r)))state.favorites.push({symbol:r.symbol,name:r.name||r.symbol,market:recM(r)});save();alert('تم الحفظ في المفضلة')}
function deleteRec(i){if(!confirm('حذف التوصية؟'))return;recRun++;state.recs.splice(i,1);save();renderRecs()}
async function refreshRecs(i){let token=++recRun,page=scanRun,list=i===undefined?state.recs.filter(r=>recM(r)===recMarket):[state.recs[i]];for(let r of list){if(!r||token!==recRun||page!==scanRun)return;r.status='جارٍ التحديث';renderRecs();try{let j=await yahoo('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(r.symbol)+'?range=2y&interval=1d'),a=j.chart.result[0],q=a.indicators.quote[0],m=recM(r);if(m==='us'&&!['NMS','NGM','NCM','NAS'].includes(a.meta.exchangeName))throw Error('ليس سهم ناسداك');if(m==='sa'&&a.meta.currency!=='SAR')throw Error('عملة غير متوقعة');if(token!==recRun||page!==scanRun)return;let rows=a.timestamp.map((t,k)=>({t,c:q.close[k],h:q.high[k],l:q.low[k]})).filter(z=>Number.isFinite(z.c));let last=rows.at(-1);if(!last)throw Error('لا توجد شموع');r.last=last.c;r.lastDate=new Date(last.t*1000).toLocaleDateString('ar-SA');r.name=a.meta.longName||a.meta.shortName||r.name||r.symbol;let after=r.created?rows.filter(z=>z.t*1000>=r.created):[];r.hits=(r.targets||[]).map((v,k)=>!!r.hits?.[k]||after.some(z=>Number.isFinite(z.h)&&z.h>=v));r.stopped=!!r.stopped||after.some(z=>Number.isFinite(z.l)&&z.l<=r.stop);r.status='آخر إغلاق يومي؛ ترتيب لمس الهدف والوقف داخل الشمعة غير معلوم'}catch(e){if(token!==recRun||page!==scanRun)return;r.status='تعذر التحديث: '+e.message}save();renderRecs()}}
let wm='all',walletBusy=false;const fx=m=>m==='sa'?3.75:1,usd=n=>'$'+Number(n).toFixed(2),money=n=>Math.round(n*100)/100;
function wallet(){wm='all';walletRender()}
function walletRender(){let pos=state.positions, hist=state.history, val=pos.reduce((s,r)=>s+(r.last??r.price)*r.q,0), unreal=pos.reduce((s,r)=>s+((r.last??r.price)-r.price)*r.q,0), sales=hist.filter(r=>r.type==='بيع'), realized=sales.reduce((s,r)=>s+(r.pnl||0),0), total=state.cash+val, stats=[['الرصيد المتاح',usd(state.cash)],['قيمة الأسهم التقديرية',usd(val)],['الأرباح المحققة',usd(sales.reduce((s,r)=>s+Math.max(0,r.pnl||0),0))],['الخسائر المحققة',usd(sales.reduce((s,r)=>s+Math.min(0,r.pnl||0),0))],['صافي الربح المحقق',usd(realized)],['الربح غير المحقق',usd(unreal)],['الصفقات المفتوحة',pos.length],['عمليات البيع',sales.length]];let points=[10000,...(state.walletCurve||[]).map(x=>x.value),total],lo=Math.min(...points),hi=Math.max(...points),coords=points.map((v,i)=>`${10+280*i/Math.max(1,points.length-1)},${90-80*(v-lo)/Math.max(1,hi-lo)}`).join(' ');$('content').innerHTML=`<section style="text-align:center"><h3>💰 محفظة عزيز الوهمية</h3><h1>${usd(total)}</h1><p>${money(total*3.75).toFixed(2)} ريال سعودي</p><small>قيمة تقديرية • السعر الأخير المحفوظ أو سعر التكلفة عند غياب السعر • دون رسوم</small></section><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${stats.map(([k,v])=>`<section style="text-align:center;margin:0"><h3>${v}</h3>${k}</section>`).join('')}</div><section><div class="markets">${[['all','الكل'],['sa','السعودي'],['us','ناسداك']].map(([m,n])=>`<button class="${wm===m?'active':''}" onclick="wm='${m}';walletRender()">${n}</button>`).join('')}</div><button onclick="walletManual()">شراء سهم</button><button onclick="walletSellPick()">بيع سهم</button><button onclick="walletRefresh()">تحديث أسعار الأسهم ↻</button><p id="walletStatus"></p></section><h3>الأسهم المملوكة</h3>${pos.map((r,i)=>wm!=='all'&&recM(r)!==wm?'':`<section><h3>${esc(r.name||r.symbol)} — ${esc(r.symbol)}</h3><p>${marketName(recM(r))} • ${r.q} سهم</p><p>متوسط الشراء: ${recFmt(r.price*fx(recM(r)))} • آخر سعر: ${recFmt(Number.isFinite(r.last)?r.last*fx(recM(r)):NaN)} ${recM(r)==='sa'?'ريال':'دولار'}</p><p>الربح غير المحقق: ${Number.isFinite(r.last)?usd((r.last-r.price)*r.q):'غير متاح'}</p><small>${esc(r.lastDate||'لم يحدث السعر')}</small><button onclick="sell(${i})">بيع جزئي أو كامل</button><button onclick="walletDelete(${i})">حذف المركز وإعادة تكلفته</button></section>`).join('')||'<p>لا توجد صفقات مفتوحة</p>'}<h3>سجل عمليات البيع والشراء</h3>${hist.map((r,i)=>wm!=='all'&&recM(r)!==wm?'':`<section>${esc(r.type)} ${esc(r.symbol)} — ${r.q} × ${usd(r.price)} ${r.pnl===undefined?'':' • '+usd(r.pnl)}<p>${r.created?new Date(r.created).toLocaleString('ar-SA'):''}</p><button onclick="walletHistoryDelete(${i})">حذف من السجل فقط</button></section>`).join('')||'لا توجد عمليات'}<section><h3>تقرير أداء المحفظة</h3><svg viewBox="0 0 300 100" style="width:100%;max-height:160px"><polyline points="${coords}" fill="none" stroke="#e5bc65" stroke-width="2"/></svg><p>أفضل عملية بيع: ${sales.length?usd(Math.max(...sales.map(r=>r.pnl||0))):'—'} • أسوأ عملية: ${sales.length?usd(Math.min(...sales.map(r=>r.pnl||0))):'—'}</p><small>الرسم للقيمة المسجلة عند العمليات والتحديثات.</small></section><button onclick="walletReset()">إعادة ضبط المحفظة</button>`}
function walletSnapshot(){state.walletCurve??=[];state.walletCurve.push({date:Date.now(),value:state.cash+state.positions.reduce((s,r)=>s+(r.last??r.price)*r.q,0)});save()}
function walletPurchase(s,m,name,p,q){let price=p/fx(m),cost=money(price*q);if(!Number.isFinite(price)||price<=0||!Number.isSafeInteger(q)||q<=0||cost<=0||cost>state.cash)return false;let r=state.positions.find(x=>x.symbol===s&&recM(x)===m);if(r){r.price=(r.price*r.q+price*q)/(r.q+q);r.q+=q}else state.positions.push({symbol:s,name,market:m,price,q,created:Date.now()});state.cash=money(state.cash-cost);state.history.push({type:'شراء',symbol:s,market:m,q,price,created:Date.now()});walletSnapshot();return true}
function buy(i){let r=state.recs[i],m=recM(r),p=Number(prompt('أكد سعر الشراء التجريبي بالعملة المحلية',String(r.last??recEntry(r)))),q=Number(prompt('عدد الأسهم'));if(!walletPurchase(r.symbol,m,r.name,p,q))return alert('الكمية أو السعر غير صالح أو الرصيد غير كافٍ');alert('تم الشراء الوهمي')}
async function walletQuote(s,m){let j=await yahoo('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(s)+'?range=1mo&interval=1d'),a=j.chart.result[0];if(m==='sa'?a.meta.currency!=='SAR':!['NMS','NGM','NCM','NAS'].includes(a.meta.exchangeName)||a.meta.currency!=='USD')throw Error('السوق غير مطابق');let q=a.indicators.quote[0].close,k=q.findLastIndex(Number.isFinite);if(k<0||q[k]<=0)throw Error('لا يوجد سعر');return {price:q[k],name:a.meta.longName||a.meta.shortName||s,date:new Date(a.timestamp[k]*1000).toLocaleDateString('ar-SA')}}
async function walletManual(){let m=wm==='all'?market:wm,s=(prompt('رمز السهم — '+marketName(m))||'').trim().toUpperCase();if(!s)return;if(m==='sa'&&/^\d{4}$/.test(s))s+='.SR';if(!(m==='sa'?/^\d{4}\.SR$/:/^[A-Z][A-Z0-9.\-]{0,11}$/).test(s))return alert('رمز غير صالح');try{let a=await walletQuote(s,m),p=Number(prompt('أكد سعر التنفيذ الوهمي بالعملة المحلية',String(a.price))),q=Number(prompt('عدد الأسهم'));if(!walletPurchase(s,m,a.name,p,q))return alert('تعذر الشراء: تحقق من السعر والكمية والرصيد');if($('walletStatus'))walletRender()}catch(e){alert('تعذر جلب السعر: '+e.message)}}
function walletSellPick(){let rows=state.positions.map((r,i)=>({r,i})).filter(x=>wm==='all'||recM(x.r)===wm);if(!rows.length)return alert('لا توجد أسهم');let n=prompt(rows.map((x,i)=>`${i+1}: ${x.r.symbol}`).join('\n')+'\nاختر الرقم');if(n!==null&&rows[+n-1])sell(rows[+n-1].i)}
function sell(i){let r=state.positions[i];if(!r)return;let q=Number(prompt('عدد الأسهم للبيع (المتاح '+r.q+')',String(r.q))),p=Number(prompt('سعر البيع بالعملة المحلية',Number.isFinite(r.last)?String(r.last*fx(recM(r))):''))/fx(recM(r));if(!Number.isSafeInteger(q)||q<=0||q>r.q||!Number.isFinite(p)||p<=0)return;state.cash=money(state.cash+p*q);state.history.push({type:'بيع',symbol:r.symbol,market:recM(r),q,price:p,pnl:(p-r.price)*q,created:Date.now()});r.q-=q;if(!r.q)state.positions.splice(i,1);walletSnapshot();walletRender()}
async function walletRefresh(){if(walletBusy)return;walletBusy=true;let fail=0;for(let r of [...state.positions]){try{let a=await walletQuote(r.symbol,recM(r));if(state.positions.includes(r)){r.last=a.price/fx(recM(r));r.lastDate=a.date}}catch{fail++}}walletBusy=false;walletSnapshot();if($('walletStatus')){walletRender();$('walletStatus').textContent='انتهى التحديث • تعذر '+fail}}
function walletDelete(i){let r=state.positions[i];if(!r||!confirm('حذف المركز دون بيع وإعادة تكلفته للرصيد؟'))return;state.cash=money(state.cash+r.price*r.q);state.positions.splice(i,1);walletSnapshot();walletRender()}

function localCompanies(m){const rows=new Map(embeddedCompanies[m].map(x=>[x.symbol,x]));for(const x of state.companyCache?.[m]?.rows||[])if(!rows.has(x.symbol)||rows.get(x.symbol).name===x.symbol.replace(/\.SR$/,''))rows.set(x.symbol,x);return [...rows.values()].sort((a,b)=>a.symbol.localeCompare(b.symbol,'en',{numeric:true}));}
let scanPeriod=21,scanRun=0,scanRows=[],scanUniverse=[],scanMarket='sa';
const marketName=m=>m==='sa'?'السوق السعودي':'ناسداك';
function scanner(){scanMarket=market;scanRun++;scanRows=[];scanUniverse=localCompanies(scanMarket);$('content').innerHTML=`<section class="scan"><h3>⌗ الماسح الشامل</h3><div>السوق: ${marketName(market)} — السهم: لم يحلل</div><h3>AZIZ — أفضل فرص السوق</h3><small>الفحص الفني فقط، دون أخبار أو نتائج مالية • شموع يومية من Yahoo Finance</small><h3>تجهيز الرموز للفحص</h3><button id="prepareBtn" onclick="prepareUniverse()">تجهيز الرموز للفحص</button><button onclick="prepareUniverse()">تحديث قائمة الشركات</button><small id="universeStatus">${scanUniverse.length} رمزًا جاهزًا من القائمة المحفوظة</small><h3>الفترة الزمنية</h3><div class="periods">${[21,30,60,90].map((d,i)=>`<button onclick="setPeriod(${d})" data-days="${d}">${['3 أسابيع','شهر','شهرين','3 أشهر'][i]}</button>`).join('')}</div><div id="scanStatus">لم يبدأ الفحص</div><progress id="scanProgress" value="0" max="1"></progress><div class="scanActions"><button onclick="runScan()">ابدأ الفحص</button><button onclick="showUniverse()">قائمة الشركات</button><button onclick="scanRun++;$('scanStatus').textContent='تم إيقاف الفحص'">إيقاف</button></div><div id="universeList"></div><div id="scanResults"></div></section>`;setPeriod(scanPeriod);prepareUniverse()}
function setPeriod(d){scanPeriod=d;document.querySelectorAll('[data-days]').forEach(b=>b.classList.toggle('selected',+b.dataset.days===d))}
async function yahoo(url,options={}){const u=new URL(url);if(u.pathname.startsWith('/v8/finance/chart/')){const symbol=decodeURIComponent(u.pathname.split('/').pop());url='https://aziz-yahoo.azizaljohne.workers.dev/?symbol='+encodeURIComponent(symbol);}let r=await fetch(url,{...options,cache:'no-store',signal:AbortSignal.timeout(18000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function fetchCompanies(m){const url='https://aziz-stocks-symbols.azizaljohne.workers.dev/?market='+encodeURIComponent(m);const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(60000)});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error||!Array.isArray(j.symbols)||j.market!==m)throw Error(j.error||'استجابة قائمة غير صالحة');const rows=[...new Map(j.symbols.map(x=>{let symbol=String(x.symbol||'').trim().toUpperCase();if(m==='sa'&&/^\d+$/.test(symbol))symbol+='.SR';return {symbol,name:embeddedCompanies[m].find(z=>z.symbol===symbol&&z.name!==symbol.replace(/\.SR$/,''))?.name||String(x.name||symbol),market:m}}).filter(x=>m==='sa'?/^\d+\.SR$/.test(x.symbol):/^[A-Z][A-Z0-9.\-]*$/.test(x.symbol)).map(x=>[x.symbol,x])).values()].sort((a,b)=>a.symbol.localeCompare(b.symbol,'en',{numeric:true}));if(!rows.length||rows.length<100)throw Error('قائمة السوق غير مكتملة');state.companyCache??={};state.companyCache[m]={rows,updated:Date.now()};save();return rows}
async function loadUniverse(){let m=scanMarket,el=$('universeStatus');if(!el)return;el.textContent='جارٍ جلب قائمة السوق...';try{let rows=await fetchCompanies(m);if(m!==scanMarket||!el.isConnected)return;scanUniverse=localCompanies(m);el.textContent=`تم تحميل ${rows.length} رمزًا — جاهز للفحص`;}catch(e){if(!el.isConnected||m!==scanMarket)return;let cache=state.companyCache?.[m];scanUniverse=localCompanies(m);el.textContent='تعذر التحديث: '+e.message+(scanUniverse.length?' — آخر قائمة محفوظة: '+scanUniverse.length:' — لا توجد قائمة كاملة محفوظة');}}

state.memory??=[];let memMarket='sa',memFilter='all',memBusy=false;
function memRecord(r,source){if(!r.symbol||!r.asof||!Array.isArray(r.targets)||r.targets.length!==3||!(r.stop>0&&r.stop<r.entry&&r.targets.every((v,i)=>v>(i?r.targets[i-1]:r.entry))))return;let id=[r.market,r.symbol,r.asof].join('|');if(state.memory.some(x=>x.id===id))return;let k=r.metrics||{},tags=[['MACD',k.hist>0],['السيولة',k.rvol>=1.5],['التجميع المحتمل',k.obv>0&&k.mfi>=50],['اتجاه EMA',k.e9>k.e20&&k.e20>k.e50],['شموع انعكاسية',/مطرقة|ابتلاع/.test(k.candle||'')]].filter(x=>x[1]).map(x=>x[0]);state.memory.push({id,symbol:r.symbol,name:r.name||r.symbol,market:r.market,asof:r.asof,entry:r.entry,targets:r.targets,stop:r.stop,score:r.score,source,tags,status:'pending',hits:0,created:Date.now()});save()}
function memPage(m=market){memMarket=m;memFilter='all';memRender()}
function memRender(){let a=state.memory.filter(r=>r.market===memMarket),q=$('memSearch')?.value||'',period=$('memPeriod')?.value||'0',cut=Date.now()-Number(period)*86400000;a=a.filter(r=>!Number(period)||r.created>=cut);let win=a.filter(r=>r.status==='win'),loss=a.filter(r=>r.status==='loss'),closed=[...win,...loss],avgret=closed.length?closed.reduce((s,r)=>s+r.ret,0)/closed.length:null,stats=[['all','إجمالي الإشارات',a.length],['win','ناجحة',win.length],['loss','خاسرة',loss.length],['pending','تحت المتابعة',a.filter(r=>r.status==='pending').length],['uncertain','غير محسومة',a.filter(r=>r.status==='uncertain').length],['closed','نسبة النجاح',closed.length?(100*win.length/closed.length).toFixed(1)+'%':'—'],['closed','متوسط العائد',avgret===null?'—':avgret.toFixed(2)+'%']];$('content').innerHTML=`<section id="memRoot"><h2>🧠 ذاكرة عزيز</h2><button onclick="memPage('sa')">السعودي</button><button onclick="memPage('us')">ناسداك</button><input id="memSearch" placeholder="بحث بالاسم أو الرمز أو التاريخ" value="${esc(q)}" oninput="memRows()"><select id="memPeriod" onchange="memRender()">${[0,7,30,365].map((v,i)=>`<option value="${v}" ${period==v?'selected':''}>${['كل الفترات','أسبوع','شهر','سنة'][i]}</option>`).join('')}</select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${stats.map(([k,n,v])=>`<button style="background:#203550;color:#efc674" onclick="memFilter='${k}';memRows()">${n}<br>${v}</button>`).join('')}</div><button onclick="memRefresh()">تحديث نتائج الذاكرة</button><button onclick="memExport()">نسخة احتياطية</button><p id="memStatus"></p><h3>أداء المؤشرات التاريخي</h3>${[...new Set(a.flatMap(r=>r.tags))].map(t=>{let b=closed.filter(r=>r.tags.includes(t));return `<p>${esc(t)}: ${b.length?(100*b.filter(r=>r.status==='win').length/b.length).toFixed(1)+'%':'—'} (${b.length} محسومة)</p>`}).join('')}<p>متوسط مدة تحقق الهدف الأول: ${win.length?(win.reduce((s,r)=>s+r.days,0)/win.length).toFixed(1)+' يوم':'—'}</p><div id="memRows"></div><small>النجاح = الهدف الأول قبل الوقف، والعائد افتراضي عند الهدف الأول أو الوقف دون رسوم. لا نعرف ترتيب الأحداث داخل الشمعة اليومية. لا تعديل تلقائي للمعادلات.</small></section>`;memRows()}
function memRows(){let q=$('memSearch').value.toLowerCase(),days=Number($('memPeriod').value);$('memRows').innerHTML=state.memory.filter(r=>r.market===memMarket&&(!days||r.created>=Date.now()-days*86400000)&&(memFilter==='all'||memFilter===r.status||memFilter==='closed'&&['win','loss'].includes(r.status))&&(r.symbol+' '+r.name+' '+r.asof).toLowerCase().includes(q)).map(r=>`<details class="eyeCard"><summary>${esc(r.name)} — ${esc(r.symbol)} • ${({win:'ناجحة',loss:'خاسرة',pending:'متابعة',uncertain:'غير محسومة'})[r.status]}</summary><p>${esc(r.asof)} • ${esc(r.source)} • ${r.score}/100</p><p>دخول ${recFmt(r.entry)} • أهداف ${r.targets.map(recFmt).join(' / ')} • وقف ${recFmt(r.stop)}</p><p>الأهداف المحققة ${r.hits} • العائد ${recFmt(r.ret)}% • آخر درجة ${r.latestScore??'—'}</p><button onclick="memDelete(${state.memory.indexOf(r)})">حذف</button></details>`).join('')||'لا توجد نتائج'}
function memDelete(i){if(confirm('حذف الإشارة؟')){state.memory.splice(i,1);save();memRender()}}
async function memRefresh(){if(memBusy)return;memBusy=true;let list=state.memory.filter(r=>r.market===memMarket),done=0,fail=0;for(let r of list){try{let j=await yahoo('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(r.symbol)+'?range=2y&interval=1d'),a=j.chart.result[0],d=fullMetrics(a);if(!state.memory.includes(r))continue;r.latestScore=d.score;let rows=d.r.filter(z=>new Date(z.t*1000).toISOString().slice(0,10)>r.asof);if(r.status==='pending'&&d.r[0].t*1000>Date.parse(r.asof))r.status='uncertain';for(let z of rows){if(r.status==='loss'||r.status==='uncertain')break;let hit=r.targets.filter(t=>z.h>=t).length,stop=z.l<=r.stop;if(r.status==='pending'){if(hit&&stop){r.status='uncertain';break}if(stop){r.status='loss';r.ret=100*(r.stop/r.entry-1);break}if(hit){r.status='win';r.ret=100*(r.targets[0]/r.entry-1);r.days=(z.t*1000-Date.parse(r.asof))/86400000;r.hits=hit}}else if(r.status==='win'){if(stop)break;r.hits=Math.max(r.hits,hit)}}save()}catch{fail++}done++;if($('memStatus'))$('memStatus').textContent=`فحص ${done}/${list.length} • تعذر ${fail}`}memBusy=false;if($('memRoot')){memRender();$('memStatus').textContent=`فحص ${done}/${list.length} • تعذر ${fail}`}}
function memExport(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state.memory.filter(r=>r.market===memMarket),null,2)],{type:'application/json'}));a.href=u;a.download='AZIZ-memory-'+memMarket+'.json';a.click();URL.revokeObjectURL(u)}
let activePage=-1;const originalOpen=openPage;openPage=function(i){activePage=i;originalOpen(i);let b=document.createElement('button');b.textContent='حذف الكل / تفريغ القسم';b.onclick=clearSection;$('page').querySelector('nav').after(b)};
function clearSection(){if(!confirm('تفريغ هذا القسم فقط؟'))return;let i=activePage;if(i===0){scanRun++;scanRows=[];renderScan();$('scanProgress').value=0;$('scanStatus').textContent='تم تفريغ النتائج';return}if(i===1){analysisRecord=null;$('symbol').value='';$('result').innerHTML='';return}if(i===2)state.favorites=[];if(i===3){state.alerts=[];alertResults.clear()}if(i===4||i===7){if(state.companyCache)delete state.companyCache[i===4?'sa':'us'];companyRows=[];renderCompanies();save();return}if(i===5){recRun++;state.recs=state.recs.filter(r=>recM(r)!==recMarket);save();renderRecs();return}if(i===6){state.eye=(state.eye||[]).filter(r=>r.market!==eyeMarket);save();renderEye();return}if(i===8){state.guards=state.guards.filter(r=>r.market!==guardMarket);save();renderGuard();return}if(i===9){rbRun++;state.rebounds[rbMarket]=[];save();rbRender();$('rbProgress').value=0;$('rbStatus').textContent='تم التفريغ';return}if(i===10){smData().watch=[];smData().events=[];save();smRender();return}if(i===11){state.memory=state.memory.filter(r=>r.market!==memMarket);save();memRender();return}if(i===12){if(!confirm('إعادة المحفظة الوهمية إلى 10000 دولار وحذف العمليات؟'))return;state.cash=10000;state.positions=[];state.history=[];state.walletCurve=[]}save();openPage(i)}
</script></html>
