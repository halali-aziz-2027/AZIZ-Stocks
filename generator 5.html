<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولّد أكواد عزيز</title><style>body{background:#101c2e;color:#edc675;font:18px system-ui;max-width:600px;margin:40px auto;padding:20px}input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border-radius:12px;border:1px solid #edc675;background:#1d324f;color:#fff}button{background:#edc675;color:#101c2e}textarea{height:130px;direction:ltr}[hidden]{display:none!important}</style><h1>مولّد أكواد عزيز</h1><section id="setup" hidden><p>إعداد خاص لأول مرة: اختر ملف المولّد القديم من الملفات. يُقرأ على جهازك فقط ولا يُرفع إلى الإنترنت.</p><input type="file" id="file" accept=".html,text/html"><input type="password" id="p1" placeholder="اختر كلمة سر قوية (12 حرفًا على الأقل)"><input type="password" id="p2" placeholder="تأكيد كلمة السر"><button id="save">حفظ المفتاح مشفّرًا</button></section><section id="login" hidden><input type="password" id="pw" placeholder="كلمة السر"><button id="unlock">فتح المولّد</button></section><section id="main" hidden><input id="device" dir="ltr" placeholder="رقم الجهاز AZ-..."><button id="generate">توليد كود دائم</button><textarea id="output" readonly></textarea><button id="copy">نسخ الكود</button><button id="lock">قفل المولّد</button></section><p id="status" role="status"></p><script>
const $=id=>document.getElementById(id), enc=new TextEncoder(), b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))), bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), url=a=>b64(a).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const storage='aziz.generator.encrypted.v1';let signing=null;function show(id){for(const x of ['setup','login','main'])$(x).hidden=x!==id}function status(s){$('status').textContent=s}async function derive(p,salt){let k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}const importSigning=b=>crypto.subtle.importKey('pkcs8',b,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);function guard(fn){return async()=>{try{await fn()}catch(e){status('تعذر التنفيذ: '+e.message)}}}try{show(localStorage.getItem(storage)?'login':'setup')}catch(e){status('التخزين المحلي غير متاح')}
$('save').onclick=guard(async()=>{let p=$('p1').value;if(p.length<12||p!==$('p2').value)throw Error('تحقق من طول كلمة السر وتطابقها');let f=$('file').files[0];if(!f)throw Error('اختر ملف المولّد القديم');let m=(await f.text()).match(/const\s+privateKey\s*=\s*['"]([A-Za-z0-9+/=]+)['"]/);if(!m)throw Error('لم يتم العثور على المفتاح في الملف');let raw=bytes(m[1]);let key=await importSigning(raw),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},await derive(p,salt),raw);localStorage.setItem(storage,JSON.stringify({salt:b64(salt),iv:b64(iv),cipher:b64(cipher)}));raw.fill(0);$('p1').value=$('p2').value=$('file').value='';signing=key;show('main');status('تم حفظ المفتاح مشفّرًا على هذا الجهاز')});
$('unlock').onclick=guard(async()=>{let r=JSON.parse(localStorage.getItem(storage));let raw;try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(r.iv)},await derive($('pw').value,bytes(r.salt)),bytes(r.cipher))}catch{throw Error('كلمة السر غير صحيحة')}signing=await importSigning(raw);new Uint8Array(raw).fill(0);$('pw').value='';show('main');status('تم فتح المولّد')});
$('generate').onclick=guard(async()=>{ $('output').value='';let device=$('device').value.trim().toUpperCase();if(!/^AZ-[A-F0-9]{32}$/.test(device))throw Error('رقم الجهاز غير صحيح');let payload=url(enc.encode(JSON.stringify({app:'AZIZ',device})));let sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},signing,enc.encode(payload));$('output').value='AZIZ2.'+payload+'.'+url(sig);status('تم توليد الكود')});$('copy').onclick=guard(async()=>{if(!$('output').value)return;$('output').select();try{await navigator.clipboard.writeText($('output').value);status('تم النسخ')}catch{status('انسخ النص المحدد يدويًا')}});$('lock').onclick=()=>{signing=null;$('output').value=$('device').value='';show('login');status('تم القفل')};</script></html>
